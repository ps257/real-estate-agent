[project]
name = "real-estate-agent"
version = "0.1.0"
description = "Real Estate Market Intelligence Multi-Agent (LangGraph + MCP) — student scaffold"
readme = "README.md"
requires-python = ">=3.11"
# Phiên bản theo LangChain/LangGraph 1.x LTS (semver: cho phép minor trong cùng major).
# Xem .claude/skills/langchain-dependencies để biết chính sách versioning.
dependencies = [
    "langgraph>=1.2,<2.0",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.5,<2.0",
    "langchain-mcp-adapters>=0.3,<1.0",
    # mcp SDK: giữ ở 1.x vì langchain-mcp-adapters 0.3.x chưa hỗ trợ mcp 2.x.
    "mcp>=1.24,<2.0",
    "langsmith>=0.3.0",
    "langfuse>=4.14.4,<5",
    "fastapi>=0.120,<1.0",
    "uvicorn>=0.38,<1.0",
    "sse-starlette>=2.4,<3.0",
    "pydantic>=2.11,<3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
# Provider LLM — cài riêng cái bạn dùng (mặc định OpenAI).
# `openai` là SDK chính thức, dùng trực tiếp cho guardrail classifier
# (structured outputs + timeout per-request). `langchain-openai` dành cho các
# node LangGraph sắp làm (intent / entities / compose).
llm = ["langchain-openai>=0.3,<1.0", "openai>=1.99"]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
